[package]
name = "hsh-erp-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "hsh_erp_rust"
path = "src/lib.rs"

# 2026-09-23 PR13 Phase A：新增独立 dev-only crate `test-support/` 承载集成测试共享基建。
#
# 没有 `[workspace]` 时把 path = "test-support" 列在 dev-deps，cargo 1.98
# 触发 `features.rs:325 did not find features for ...` resolver panic
# （path-sibling 包未注册到 workspace context）。处理：把根仓升级为「虚拟 workspace」
# —— root `[workspace]` 仅声明 members，不在子目录上各放一份，避免 cargo 元数据
# 重复（保留原 `[package]` 当「根成员」的语义：`cargo build` / `cargo test`
# 不带 `-p` 时仍以 hsh-erp-rust 为默认入口）。
[workspace]
members = [".", "test-support"]
resolver = "2"

# 2026-09-23 PR13：workspace 已声明 `members = [".", "test-support"]`，
# cargo 自动从 dev-deps 派生 path dep 关系，无需手工 [workspace.dependencies]。

# ---------------------------------------------------------------------------------
# 后续业务实现阶段会按需追加（文档见 docs/architecture.md）：
#   rust_decimal / bigdecimal    —— 金额、数量（Numeric 列）
#   umya-spreadsheet 或 calamine —— 送货单 Excel 模板填充
#   printpdf / lopdf              —— PDF 拆分与渲染
#   barcoders                     —— Code128 条码
#   rmcp                          —— MCP Streamable HTTP（远期）
#
# 集成测试 PG 基建：见 [dev-dependencies] 下方注释 + scripts/test_runner.sh。
# 容器生命周期由 .cargo/config.toml runner 接管（绑到 binary 进程，shell trap EXIT 清理），
# 不依赖任何 testcontainers 库；2026-09-20 起替代原 `ephemeral-postgres` crate
# （后者把 Cluster 放 static OnceCell → docker 容器永不释放，已堆 128 个）。
# ---------------------------------------------------------------------------------

[dependencies]
# 数值与 PDF
rust_decimal = { version = "1", features = ["serde-with-str"] }
lopdf = { version = "0.44", default-features = false }

# Web 框架
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "request-id", "compression-gzip", "catch-panic"] }

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"                                                # CancellationToken

# 数据库
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono",
    "migrate",
    "rust_decimal",
] }

# 序列化与时间
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
thiserror = "2"
anyhow = "1"                                                      # 仅 main 启动流程

# 日志追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 认证与安全
jsonwebtoken = { version = "10", features = ["rust_crypto"] }     # 双 token（access + refresh 轮转）
bcrypt = "0.17"

# Redis（用户会话存储，服务端 session 真相源；吊销 access token 用）
# - redis 1.x：deadpool-redis 0.23 透传；显式 pin + 关闭默认 features，避免拖入多余 runtime
# - deadpool-redis 0.23：连接池，默认 feature rt_tokio_1 拉 `redis/tokio-comp`
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
deadpool-redis = "0.23"

# 2026-09-23 重构：本轮 Redis session key 由 `sha256(token)` 改为 JWT 自带 jti
# （UUID v4），`auth::session::hash_token` 函数被删除。但 `sha2` crate **保留**——
# `part_file::repo::hash_bytes`（文件内容 sha256，用于 `t_part_file.content_sha256`
# 去重唯一索引 `uk_t_part_file_part_kind_sha`）仍依赖它，与 auth 改造正交。
sha2 = "0.10"

# 配置加载
dotenvy = "0.15"

# 异步与并发工具
async-trait = "0.1"                                               # CosClient dyn 兼容
futures-util = "0.3"                                              # ws StreamExt/SinkExt
dashmap = "6"                                                     # ws 连接注册表

# 2026-09-23 新增 Idempotency 中间件：`IdempotencyStore` trait 在主二进制也
# 需要 `#[automock]`（与 `CosClient` / `SessionStore` 模式一致），故 mockall
# 上移到主依赖而非仅 dev-deps。
mockall = "0.15"

# Excel 模板（送货单打印，P4）
# 任务说明强制指定 umya-spreadsheet = "2"；最新 3.x 已移除 get_* 弃用方法，
# 需重写代码。这里先用 "2" 走通后续 P4 实施；后续可统一升级 + 评估。
umya-spreadsheet = "2"

# 2026-09-20 迁移清理：OpenDAL S3 backend（COS 兼容）+ reqwest HTTP 客户端。
#
# 历史（2026-09-11 ~ 2026-09-16）：用社区 SDK `cos-rust-sdk`（仿 cos-python-sdk-v5
# 风格）覆盖 put/get/delete/head；presigned URL SDK 未提供，单独用 `hmac` + `sha1` +
# `hex` + `base64` 手写 COS V1 签名（两步 HMAC-SHA1）。
#
# 2026-09-20 迁移：全量切到 Apache OpenDAL（services-s3 走 S3 v4 兼容，services-memory
# 走本地 in-memory BTreeMap）；cos-rust-sdk/hmac/sha1/hex/base64 全删，codebase 净减
# ~325 行（V1 Presigner / 已知向量测试 / percent_encode helpers）。详见
# `OPENDAL_SPIKE.md` §7 + §12。
#
#   - services-s3：真实 COS 走 OpenDAL 内置 S3 builder + presign（S3 v4）
#   - services-memory：本地 in-memory BTreeMap，单测 / 集成测 0 网络依赖
#   - 0.53 无 TLS feature 名（TLS 由传递依赖 reqwest 自行选择，rustls 是默认）
opendal = { version = "0.53", default-features = false, features = [
    "services-s3",
    "services-memory",
] }

# P4 print_xml_patch 用 zip crate 直接读写 xlsx 内部 entry（绕过 umya 的
# _xlnm.Print_Aria 重复 + pageSetUpPr + shrinkToFit 缺口）。这是 umya-spreadsheet
# 的传递依赖（v2.4.2），但我们直接声明以避开「传递依赖隐性升级」风险。
zip = "2"
# 同样来自 umya-spreadsheet 的传递依赖（v0.37.5），用于 styles.xml 内
# cellXfs 段插入新的 xf（P4 shrinkToFit patch 用）。
quick-xml = "0.37"
# 渲染走 spawn_blocking；响应按 bytes 直接返 Body（Python 64KB chunk 不复刻，
# 前端 onDownloadProgress 由浏览器原生 a.download 兜住）。
tokio-stream = "0.1"

# reqwest：OpenDAL 传递依赖 + python STS HTTP 转发（infra::python_sts.rs）+ 真 COS
# 端到端回归测试（tests/cos_real_smoke.rs）。rustls-tls 避免拖入 OpenSSL；
# `json` feature 是 `RequestBuilder::json()` 必需（python_sts.rs 用它序列化请求体）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# 2026-09-18 M3-B 新增：upload_session 域 `tmp/sess/<session_uuid>/` 派生。
# v4 随机 UUID；原 upload-intents batch_uuid 派生已删除（迁移至 upload_session）。
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 集成测试用 tower::ServiceExt::oneshot 直接驱动 Router。
# 主依赖已有 tower = "0.5"，rustc 会 union features（"util" 仅 dev 启用，发布构建不携带）。
tower = { version = "0.5", features = ["util"] }

# 2026-09-23 PR13 Phase A：集成测试共享基建迁到独立 dev-only crate。
#
# 主仓 `tests/common/mod.rs`（1393 行）+ `tests/common/pem.rs`（209 行）按
# 职责切到 `test-support/src/{pool, pem, redis, state, fixtures}.rs`；
# `tests/common/mod.rs` 保留为 facade，仅 `pub use hsh_erp_test_support::*;`
# 把符号透传给现有 51 个 integration test binary（暂不改 import；
# Phase B/C/D 按 domain 拆 helper 时再统一切到直接 `use hsh_erp_test_support::*;`）。
#
# 反向依赖关系：test-support 的 `[dependencies]` 声明 `hsh-erp-rust = { path = ".." }`
# 是 cargo 允许的常规模式。编译顺序：hsh-erp-rust → hsh-erp-test-support → integration
# tests，依赖图无环。
hsh-erp-test-support = { path = "test-support" }

# 2026-09-20 重大重构：去掉 `ephemeral-postgres` 依赖，改用自定义 bash runner 方案。
# 背景：ephemeral-postgres 0.3 把 Cluster 放在 `static OnceCell<Cluster>`，
# Rust static 永不 Drop → docker 容器永不释放（用户实测已堆 128 个 postgres:18-alpine）。
#
# 新方案架构（两层隔离模型）：
# 1) .cargo/config.toml 的 `runner = "scripts/test_runner.sh"` 接管每个 integration
#    test binary 的 PG 容器生命周期 —— shell `trap EXIT` 强制清理，零 Rust Drop 依赖。
# 2) nextest session 模式：scripts/test_nextest.sh 起 1 个 session 级容器，
#    每个测试 fresh database（test_pool() 内部 CREATE DATABASE test_<uuid>）。
#
# 两层都消除了原方案的两个 flaky 根因：
#   - 根因 #1：跨 binary 共享 (epoch, instance=1) 撞 snowflake ID →
#     现在每进程用 pid⊕nanos 派生唯一 instance（test_snowflake_instance()）
#   - 根因 #2：原 postgres-test 单库被 36 binary 共享 → TRUNCATE 残留 +
#     _sqlx_migrations 状态串号 → 现每测试 fresh database
#
# 进程内 binary 限速仍走 RUST_TEST_THREADS=4（同 .cargo/config.toml），
# nextest 模式下由 .config/nextest.toml 的 test-threads=8 控制。
# 历史注解（已删）保留了 ephemeral-postgres 0.3 方案的注释；现方案不需要任何
# testcontainers 库依赖。

# 2026-09-18 auth+user DI 重构（Wave 1A/T1）：service 单测在 src/modules/{auth,user}/service_tests.rs
# 用 mockall 对 repo trait / SessionStore / UowProvider 做 automock；测试零数据库依赖。
# 注：plan v4 §3 写 `mockall = "1"`，实际 crates.io 最新是 0.15.0（无 1.x 发布）；按现行版本落地。
# 2026-09-23 注：mockall 已上移到主依赖（IdempotencyStore automock），dev-deps 仅保留注释。

# 2026-09-15 followup-cleanup A4：dashboard WS E2E 测试用真实 socket 客户端连接
# ws://127.0.0.1:<random>/ws/dashboard?token=<JWT>。版本对齐 axum 0.8 已传递依赖
# 的 tokio-tungstenite 0.29（避免 union features 之外引入额外版本）。
tokio-tungstenite = "0.29"

# calamine 现在的角色：P4 集成测试（tests/delivery_print_api.rs）回读生成的
# xlsx 断言关键单元格。它是 umya-spreadsheet 的传递依赖，但这里**显式声明**
# 让 dev-only 限制在测试范围内（P0 spike 时期它在主依赖里是因为 [[bin]] 不接受
# dev-deps；spike 已废弃，移除 bin 后即可下放到 dev-deps）。
calamine = "0.26"

# 2026-09-21：test 进程退出时 DROP DATABASE。tests/common/mod.rs 注册 libc::atexit
# handler 回收 fresh_database_url() 在本进程创建的 test_<uuid> 库，避免 nextest
# session tmpfs 累积（439 测试 × 库大小）。已在 tokio 传递依赖树里，固定版本
# 锁定避免版本漂移；tokio 未引用时 [dev-dependencies] 仍正常解析。
libc = "0.2"

# 2026-09-23 重构：JWT 切 RS256 + kid 多密钥轮换。tests/common/pem.rs 在每个
# 测试进程首调 `test_private_pem()` / `test_public_pem()` 时用 rsa crate 生成
# 2048-bit RSA 密钥对（OnceLock 缓存，过程内不写磁盘）。`pem` feature 启
# `to_pkcs8_pem` / `to_public_key_pem` 走 PEM 输出，与 jsonwebtoken 的
# `EncodingKey::from_rsa_pem` / `DecodingKey::from_rsa_pem` 配套。
# 生产构建**不**引入 rsa（dev-only）。
rsa = { version = "0.9", features = ["pem"] }

# 2026-09-23 重构：tests/auth_middleware.rs 的 `protected_endpoint_with_alg_none_returns_40100`
# 负向用例手工拼 alg=none 的 JWT（header / payload base64url），避免引 `jsonwebtoken`
# 库（其 0.10 起已禁 alg=none 的 encode，构造不出来）。base64 已是传递依赖
# （opendal / reqwest 等），但显式声明避免 union features 漂移。
base64 = "0.22"

# ---------------------------------------------------------------------------------
# P0 spike bin 已删除（迁移到 src/modules/delivery_note/print.rs）。
# ---------------------------------------------------------------------------------