# hsh-erp-rust 本地开发用编排
#
# 端口选择：
#   - 5430：开发库 PG（`hsh`）；
#   - 5429：测试库 PG（`postgres_rust_test`）；
#   - 6379：开发库 Redis（session store）；
#   - 6380：测试库 Redis（session store；测试用 FLUSHDB，不挂卷）


services:
  postgres-dev:
    image: postgres:18-alpine
    container_name: dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hsh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-6065161}
      POSTGRES_DB: ${POSTGRES_DB:-hsh}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5430:5432"
    volumes:
      - hsh-pdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsh} -d ${POSTGRES_DB:-hsh}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:18-alpine
    container_name: test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hsh_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-6065161test}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-postgres_rust_test}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5429:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-hsh_test} -d ${POSTGRES_TEST_DB:-postgres_rust_test}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-pdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: redis-test
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hsh-pdata:
  redis-pdata: