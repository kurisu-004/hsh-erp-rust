# 2026-09-20 新增：cargo-nextest profile
#
# 背景：原 libtest binary 间串行 + binary 内 4 线程（.cargo/config.toml RUST_TEST_THREADS=4）
# 跑 ~5min。改用 nextest process-per-test + binary 级并行，目标 ~1min 全量。
#
# 2026-09-21 调整 test-threads=8 → 15：本机 15 physical cores 实测对比
# （8 / 12 / 15 / 20 四个档位，全量 817 测试）：
#   threads=8  → 3m5.5s（基线）
#   threads=12 → 57.8s   （3.2x）
#   threads=15 → 51.1s   （3.6x，甜点）
#   threads=20 → 59.4s   （3.1x，过订阅反而慢）
# 设为 15 匹配物理核数；连接预算 15 × 11 ≈ 165 < session 容器 max_connections=500。
#
# 设计点：
# - test-threads=15：见上基准测试结果
# - fail-fast=false：全量跑收齐所有失败（CI 友好）
# - slow-timeout 60s/2x：HTTP/WS 测试宽松超时 —— 60s 告警、120s 杀

[profile.default]
test-threads = 15
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

# 2026-09-20 修复竞态 #2：3 个 FLUSHDB binary 串行（_e2e_api / auth_middleware /
# iam_api 在 setup 调 FLUSHDB；nextest 跨 binary 并行下会杀并行测试的 session →
# 40105 SESSION_REVOKED flake）。max-threads=1 让这 3 个 binary 的测试串行跑，
# 跨 binary 仍并行（其余 40 个 binary 全并行）。[test-groups] 必须先声明 group
# 名才能在 overrides 里引用（nextest 强类型校验）。
# 2026-09-23 PR13 Phase E：iam_api + auth_middleware 已合为 `tests/iam/`
# （binary 名 = `iam`）；FLUSHDB binary 从 3 个减为 2 个。
[test-groups]
redis-flush = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(/^(_e2e_api|iam)$/)"
test-group = "redis-flush"
