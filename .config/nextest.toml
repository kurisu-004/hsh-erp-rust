# 2026-09-20 新增：cargo-nextest profile
#
# 背景：原 libtest binary 间串行 + binary 内 4 线程（.cargo/config.toml RUST_TEST_THREADS=4）
# 跑 ~5min。改用 nextest process-per-test + binary 级并行，目标 ~1min 全量。
#
# 2026-09-21 调整 test-threads=8 → 15：本机 15 physical cores 实测对比
# （8 / 12 / 15 / 20 四个档位，全量 817 测试）：
#   threads=8  → 3m5.5s（基线）
#   threads=12 → 57.8s   （3.2x）
#   threads=15 → 51.1s   （3.6x，甜点）
#   threads=20 → 59.4s   （3.1x，过订阅反而慢）
# 设为 15 匹配物理核数；连接预算 15 × 11 ≈ 165 < session 容器 max_connections=500。
#
# 设计点：
# - test-threads=15：见上基准测试结果
# - fail-fast=false：全量跑收齐所有失败（CI 友好）
# - slow-timeout 60s/2x：HTTP/WS 测试宽松超时 —— 60s 告警、120s 杀

# 2026-09-20 曾有一个 `redis-flush` 串行组（`_e2e_api` / `iam` 两个 binary
# `max-threads = 1`），用于防「测试 setup 调 FLUSHDB 杀掉并行测试的 session」——
# 那两个 binary 当时各自独占一个 Redis db，FLUSHDB 只会清自己。
# 2026-10-09 该组**已整体删除**（review 第 1 轮 Q5）：
# - Redis 隔离改由 key 前缀（`test-support/src/redis.rs::test_key_prefix`）承担，
#   所有测试进程共用 db 0 但前缀空间物理不相交，不需要任何串行组；
# - 触发该组的 `clean_redis`（FLUSHDB）本身也已删除（全仓零调用方），
#   即「FLUSHDB 会杀掉别人 session」的前提已不存在；
# - 顺带恢复这两个 binary 的并行度（原先纯属白串行）。
# ⚠️ 未来确需清理 Redis 时，**不要**恢复本组去「兜底」：正确做法是按本进程前缀
# `SCAN` + `DEL`（`SCAN MATCH "t{pid}:*"`），只碰自己的命名空间。
[profile.default]
test-threads = 15
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
